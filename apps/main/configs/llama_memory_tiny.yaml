dump_dir: /workspace/dumps/llama_mem_tiny
name: llama_mem_tiny
steps: 60_000
probe_freq: null
seed: 777

optim:
  lr: 3e-3
  weight_decay: 0.033
  warmup: 5000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 128
  n_layers: 4
  n_heads: 4
  productkey_args: 
    is_enabled: True
    layers:  "2"
    mem_share_values: True
    mem_n_keys: 64
    value_fixed_lr: 0.001
    swilu_projection: True
    mem_k_dim: 128

data:
  root_dir: data
  sources:
    fineweb_edu_10bt_shuffled: 1.0
  batch_size: 4
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: tiktoken
    path: tokenizer/original/tokenizer.model

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 2500
    keep: 3
  eval:
    every: 5000
    keep: -1

logging:
  freq: 1
  wandb:
    entity: algoverse-memory-expansion
    project: base-model

async_eval_gpus: 8
eval:
  harness:
    tasks:
      - hellaswag
      - nq_open
      - piqa
      - siqa
      - csatqa
      - winogrande
      - arc
      - race
      - gsm8k
      - bbh
      - mmlu
  generator:
    max_tokens: 16384
    dtype: bf16